name: Feature branch syntax check

on:
  push:
    branches:
      - feature/radiance-kids
  workflow_dispatch:

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile main.py
        run: python -m py_compile main.py
