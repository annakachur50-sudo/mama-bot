name: Radiance and Kids Syntax Check

on:
  push:
    branches:
      - feature/radiance-kids
      - fix/kids-variety-fileid-20261022
      - feat/multi-kids-radiance-tone-20261022
      - feat/age-adaptive-kids-gemini-20261022
      - fix/radiance-ux-teen-labels-20261023
      - fix/vision-grounding-mom-directed-kids-20261023
      - improve/kids-radiance-inline-nav-20261023
      - fix/kids-riddle-spoiler-20261023-v2
      - audit/kids-activities-all-ages-20261030
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_live_gemini:
        description: "Разрешить реальные платные запросы Gemini для выборочного теста"
        required: true
        type: boolean
        default: false

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      HAS_GEMINI_KEY: ${{ secrets.GOOGLE_API_KEY != '' }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile main.py
        run: python -m py_compile main.py
      - name: Run age-adaptation tests
        run: python -m unittest discover -s tests -v
      - name: Install dependencies for live Gemini check
        if: inputs.run_live_gemini == true && env.HAS_GEMINI_KEY == 'true'
        run: python -m pip install -r requirements.txt
      - name: Sample real Gemini age outputs
        if: inputs.run_live_gemini == true && env.HAS_GEMINI_KEY == 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: "123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
        run: python scripts/test_kids_gemini_samples.py
      - name: Explain skipped live Gemini check
        if: inputs.run_live_gemini != true || env.HAS_GEMINI_KEY != 'true'
        run: echo "Real Gemini samples skipped: explicit opt-in is required and GOOGLE_API_KEY must be configured."

# Keep this check scoped to the isolated MVP branch; it never deploys the bot.
